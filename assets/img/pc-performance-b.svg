<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="pb-tela" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b83c3c"/>
      <stop offset="100%" stop-color="#e26b6b"/>
